name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: archlinux:latest
    env:
      OMARCHY_PATH: ${{ github.workspace }}/.ci/omarchy
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
      WAYLAND_DISPLAY: wayland-ci
      LIBGL_ALWAYS_SOFTWARE: "1"
      QSG_RHI_BACKEND: software
      QT_QUICK_BACKEND: software
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            git \
            namcap \
            nodejs \
            python \
            python-pytest \
            quickshell \
            qt6-declarative \
            qt6-multimedia \
            shellcheck \
            ttf-hack-nerd \
            weston

      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: basecamp/omarchy
          ref: 9b693cca63d111fc3faba16aea149d226881b427
          path: .ci/omarchy
      - name: Trust container-mounted checkouts
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$OMARCHY_PATH"
      - name: Configure Qt tools
        run: echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"
      - name: Start headless Wayland compositor
        run: |
          install -dm700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 > /tmp/weston.log 2>&1 &
          for attempt in $(seq 1 50); do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && exit 0
            sleep 0.1
          done
          cat /tmp/weston.log
          exit 1

      - name: Run release checks
        run: ./scripts/check.sh

      - name: Verify tag matches VERSION
        run: |
          version="$(cat VERSION)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          fi

      - name: Validate manifest/VERSION parity
        run: python3 -m pytest tests/test_manifest_contracts.py -q

      - name: Build and rehearse Arch package
        run: scripts/rehearse-aur-package --output-dir dist

      - name: Build deterministic archive and checksums
        run: scripts/build-release-archive --check-reproducible

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta.') || contains(github.ref_name, '-rc.') }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tar.gz.inventory.json
            dist/*.pkg.tar.zst
