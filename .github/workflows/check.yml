name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:latest
    env:
      OMARCHY_PATH: ${{ github.workspace }}/.ci/omarchy
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
      WAYLAND_DISPLAY: wayland-ci
      LIBGL_ALWAYS_SOFTWARE: "1"
      QSG_RHI_BACKEND: software
      QT_QUICK_BACKEND: software
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            git \
            namcap \
            nodejs \
            python \
            python-pytest \
            quickshell \
            qt6-declarative \
            qt6-multimedia \
            shellcheck \
            ttf-hack-nerd \
            weston
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: basecamp/omarchy
          ref: f0020448ca87329199de7cb12f2015ebc4a3e5e7
          path: .ci/omarchy
      - name: Trust container-mounted checkouts
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$OMARCHY_PATH"
      - name: Configure Qt tools
        run: echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"
      - name: Start headless Wayland compositor
        run: |
          install -dm700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 > /tmp/weston.log 2>&1 &
          for attempt in $(seq 1 50); do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && exit 0
            sleep 0.1
          done
          cat /tmp/weston.log
          exit 1
      - name: Verify required runtimes
        run: |
          python3 --version
          node --version
      - name: Run checks
        run: ./scripts/check.sh
      - name: Rehearse AUR package
        run: scripts/rehearse-aur-package
